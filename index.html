<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle / Volume</title><style>*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;background:#141516;color:#eee;font:12px Arial,sans-serif;overflow:hidden}main{flex:1;position:relative;min-width:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}aside{width:310px;overflow:auto;padding:24px;background:#1d1e20;border-left:1px solid #353638}h1{font-size:21px;letter-spacing:-1px;margin:0 0 5px}small,p{color:#999;line-height:1.5}section{border-top:1px solid #3a3b3d;margin-top:21px;padding-top:16px}h2{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#a7a9aa;margin:0 0 12px}label{display:flex;align-items:center;gap:9px;margin:12px 0}label span{flex:1}output{width:42px;text-align:right;font:11px monospace;color:#aebbb7}input[type=range]{width:105px;accent-color:#c9e5d9}input[type=color]{width:42px;height:26px;background:none;border:1px solid #555}button,select{font:inherit;color:inherit;background:#292b2d;border:1px solid #454749;padding:9px;border-radius:3px;cursor:pointer}button:hover{border-color:#c9e5d9}button.primary{background:#c9e5d9;color:#17221e;border:0;font-weight:bold;width:100%}.row{display:flex;gap:7px}.row>*{flex:1}select{max-width:155px}#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#aaa}#empty strong{font-size:22px;font-weight:400;color:#ddd}#empty p{font-size:12px}#info{position:absolute;bottom:16px;left:18px;color:#aaa;pointer-events:none;font:11px monospace}#file{display:none} @media(max-width:720px){body{flex-direction:column}main{min-height:45vh}aside{width:100%;height:55vh}}</style></head><body><main id="stage"><canvas id="cv"></canvas><div id="empty"><strong>Uma imagem. Um volume.</strong><p>Importa um design para começar.</p></div><div id="info">Arrastar · rodar / Scroll · zoom</div></main><aside><h1>PARTICLE / VOLUME</h1><small>Estúdio de volumetria generativa · 01</small><section><h2>01 / Imagem</h2><button class="primary" id="upload">+ Importar imagem</button><input id="file" type="file" accept="image/*,.svg"><p id="name">Nenhuma imagem importada.</p><label><span>Máscara</span><select id="mask"><option value="auto">Automática</option><option value="alpha">Transparência</option><option value="dark">Traços escuros</option><option value="light">Traços claros</option><option value="all">Imagem completa</option></select></label><div id="source"></div></section><section><h2>02 / Volumetria</h2><label><span>Construção</span><select id="mode"><option value="solid">Extrusão sólida</option><option value="shell">Superfície / casca</option><option value="relief">Relevo tonal</option><option value="cloud">Nuvem volumétrica</option></select></label><div id="volume"></div></section><section><h2>03 / Partículas e fluxo</h2><div id="particles"></div><label><span>Movimento</span><select id="flow"><option value="fluid">Fluido</option><option value="orbit">Orbital</option><option value="vertical">Vertical</option><option value="none">Estático</option></select></label><div class="row"><button id="play">Pausa</button><button id="reset">Repor vista</button></div></section><section><h2>04 / Cor</h2><label><span>Modo</span><select id="color"><option value="source">Imagem original</option><option value="solid">Monocromático</option><option value="depth">Gradiente de profundidade</option></select></label><label><span>Fundo</span><input id="bg" type="color" value="#101214"></label><label><span>Cor A</span><input id="a" type="color" value="#d9ede4"></label><label><span>Cor B</span><input id="b" type="color" value="#537d99"></label></section><section><h2>05 / Câmara e exportação</h2><div id="camera"></div><label><span>Projeção</span><select id="projection"><option value="persp">Perspetiva</option><option value="ortho">Ortográfica</option></select></label><div class="row"><button id= 'use strict';const $=x=>document.getElementById(x),cv=$('cv'),gl=cv.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});const cfg={threshold:.45,depth:.45,relief:.8,count:180000,size:1.2,opacity:.72,drift:.035,speed:.6,rotation:.12,zoom:1};let image=null,pixels=null,points=null,n=0,yaw=.38,pitch=-.18,time=0,paused=false,rec=null,last=0,program,vao,buffer;const status=s=>$('status').textContent=s;
function controls(id,defs){for(const [k,label,min,max,step] of defs){let l=document.createElement('label');l.innerHTML=`<span>${label}</span><input id="s_${k}" type="range" min="${min}" max="${max}" step="${step}" value="${cfg[k]}"><output>${cfg[k]}</output>`;let el=l.querySelector('input');el.oninput=()=>{cfg[k]=+el.value;l.querySelector('output').value=cfg[k]};if(k==='count'||k==='threshold')el.onchange=build;$(id).append(l)}}controls('source',[['threshold','Limiar da máscara',.02,.98,.01]]);controls('volume',[['depth','Espessura',0,1.8,.01],['relief','Intensidade tonal',0,2,.01]]);controls('particles',[['count','Quantidade',10000,600000,10000],['size','Dimensão',.3,5,.1],['opacity','Opacidade',.05,1,.01],['drift','Dispersão',0,.3,.005],['speed','Velocidade',0,3,.05]]);controls('camera',[['rotation','Rotação automática',0,1,.01],['zoom','Zoom',.3,2.5,.01]]);
const vs=`#version 300 es
precision highp float;layout(location=0) in vec3 pos;layout(location=1) in vec3 rgb;layout(location=2) in vec3 meta;uniform float time,depth,relief,drift,speed,yaw,pitch,zoom,aspect,size,scale;uniform int mode,flow,projection;out vec3 color;out float zval;out float shade;void main(){float seed=meta.x;float lum=meta.y;float z=pos.z; if(mode==2)z=(1.-lum)*relief+(pos.z)*.12;else if(mode==3)z=pos.z*(.3+.7*(1.-lum));vec3 p=vec3(pos.xy,z*depth);float t=time*speed;float f=seed*6.28318; if(flow==0){p+=drift*vec3(sin(p.y*8.+t+f),cos(p.x*7.-t+f),sin(t*.8+f+p.x*5.));}else if(flow==1){p+=drift*vec3(cos(t+f),sin(t+f),sin(t*.7+f));}else if(flow==2){p.y+=drift*sin(t+f);p.z+=drift*.3*cos(t+f);}float c=cos(yaw),s=sin(yaw);p=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);c=cos(pitch);s=sin(pitch);p=vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);float perspective=projection==0?max(.4,2.9-p.z):2.9;float fit=zoom*2.35;gl_Position=vec4(p.x*fit/(perspective*max(1.,aspect)),p.y*fit/(perspective*max(1.,1./aspect)),clamp(-p.z*.45,-.99,.99),1.);gl_PointSize=max(.6,size*scale*(projection==0?2.9/perspective:1.));color=rgb;zval=clamp(z+.5,0.,1.);shade=clamp(.82+p.z*.23,.45,1.);}`;
const fs=`#version 300 es
precision highp float;in vec3 color;in float zval,shade;uniform vec3 ca,cb;uniform int cm;uniform float opacity;out vec4 outColor;void main(){float r=length(gl_PointCoord-.5);float a=1.-smoothstep(.32,.5,r);if(a<.005)discard;vec3 c=cm==0?color:cm==1?ca:mix(ca,cb,zval);outColor=vec4(c*shade,opacity*a);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function init(){if(!gl)throw Error('WebGL 2 indisponível.');program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);vao=gl.createVertexArray();gl.bindVertexArray(vao);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);for(let i=0;i<3;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,36,i*12)}gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.disable(gl.DEPTH_TEST)}
function build(){if(!pixels||!gl)return;let {data:d,width:w,height:h}=pixels,mask=$('mask').value,eligible=[],edges=[],m=new Uint8Array(w*h),alpha=false;for(let i=3;i<d.length;i+=4)if(d[i]<100){alpha=true;break}if(mask==='auto')mask=alpha?'alpha':'dark';let lum=i=>(d[i*4]*.2126+d[i*4+1]*.7152+d[i*4+2]*.0722)/255;for(let i=0;i<w*h;i++){let a=d[i*4+3]/255,l=lum(i);if(a>.08&&(mask==='all'||mask==='alpha'&&a>cfg.threshold||mask==='dark'&&l<cfg.threshold||mask==='light'&&l>1-cfg.threshold)){m[i]=1;eligible.push(i)}}if(!eligible.length){n=0;status('Máscara vazia. Altera o modo ou limiar.');return}for(let i of eligible){let x=i%w,y=Math.floor(i/w);if(x===0||x===w-1||y===0||y===h-1||!m[i-1]||!m[i+1]||!m[i-w]||!m[i+w])edges.push(i)}n=cfg.count;points=new Float32Array(n*9);let mode=$('mode').value,max=Math.max(w,h);for(let k=0;k<n;k++){let r=Math.random(),pool=mode==='shell'&&r<.38&&edges.length?edges:eligible,i=pool[Math.floor(Math.random()*pool.length)],x=i%w,y=Math.floor(i/w),z=Math.random()-.5;if(mode==='shell'&&pool!==edges)z=(Math.random()<.5?-.5:.5)+(Math.random()-.5)*.025;let j=k*9;points.set([(x+.5+(Math.random()-.5)*.9-w/2)/max,(h/2-y-.5+(Math.random()-.5)*.9)/max,z,d[i*4]/255,d[i*4+1]/255,d[i*4+2]/255,Math.random(),lum(i),0],j)}gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,points,gl.STATIC_DRAW);status(`${n.toLocaleString('pt-PT')} partículas · ${w} × ${h} amostragem`)}
function hex(v){return [1,3,5].map(i=>parseInt(v.slice(i,i+2),16)/255)}function uni(k,v){let l=gl.getUniformLocation(program,k);if(Array.isArray(v))gl.uniform3fv(l,v);else if(['mode','flow','projection','cm'].includes(k))gl.uniform1i(l,v);else gl.uniform1f(l,v)}function draw(mult=1){if(!gl||!program)return;let dpr=Math.min(devicePixelRatio||1,2)*mult,w=Math.max(1,Math.round(cv.clientWidth*dpr)),h=Math.max(1,Math.round(cv.clientHeight*dpr));let cap=gl.getParameter(gl.MAX_VIEWPORT_DIMS);let f=Math.min(1,cap[0]/w,cap[1]/h,8192/Math.max(w,h));w=Math.max(1,Math.floor(w*f));h=Math.max(1,Math.floor(h*f));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}gl.viewport(0,0,w,h);gl.clearColor(...hex($('bg').value),1);gl.clear(gl.COLOR_BUFFER_BIT);if(!n)return;gl.useProgram(program);gl.bindVertexArray(vao);for(let k of ['depth','relief','drift','speed','zoom','size','opacity'])uni(k,cfg[k]);uni('time',time);uni('yaw',yaw);uni('pitch',pitch);uni('aspect',w/h);uni('scale',w/Math.max(1,cv.clientWidth));uni('mode',['solid','shell','relief','cloud'].indexOf($('mode').value));uni('flow',['fluid','orbit','vertical','none'].indexOf($('flow').value));uni('projection',$('projection').value==='persp'?0:1);uni('cm',['source','solid','depth'].indexOf($('color').value));uni('ca',hex($('a').value));uni('cb',hex($('b').value));gl.drawArrays(gl.POINTS,0,n)}function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused){time+=dt;if(!drag)yaw+=dt*cfg.rotation}draw();requestAnimationFrame(tick)}
async function load(file){if(!file)return;let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let w=im.naturalWidth,h=im.naturalHeight,r=Math.min(1,2400/Math.max(w,h));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,c.width,c.height);pixels=ctx.getImageData(0,0,c.width,c.height);$('name').textContent=`${file.name} · ${w} × ${h}`;$('empty').style.display='none';build();}catch(e){status('Não foi possível importar: '+e.message)}finally{URL.revokeObjectURL(url)}}$('upload').onclick=()=>$('file').click();$('file').onchange=e=>{load(e.target.files[0]);e.target.value=''};$('mask').onchange=build;$('mode').onchange=build;let drag=false,x=0,y=0;cv.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(drag){yaw+=(e.clientX-x)*.008;pitch+=(e.clientY-y)*.008;x=e.clientX;y=e.clientY}};cv.onpointerup=cv.onpointercancel=()=>drag=false;cv.onwheel=e=>{e.preventDefault();cfg.zoom=Math.max(.3,Math.min(2.5,cfg.zoom*Math.exp(-e.deltaY*.001)));$('s_zoom').value=cfg.zoom;$('s_zoom').nextElementSibling.value=cfg.zoom.toFixed(2) };$('stage').ondragover=e=>e.preventDefault();$('stage').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'Retomar':'Pausa'};function view(a,b){yaw=a;pitch=b;cfg.rotation=0;$('s_rotation').value=0;$('s_rotation').nextElementSibling.value=0}$('front').onclick=()=>view(0,0);$('side').onclick=()=>view(Math.PI/2,0);$('reset').onclick=()=>{view(.38,-.18);cfg.zoom=1;$('s_zoom').value=1;$('s_zoom').nextElementSibling.value=1};function save(b,name){if(!b)return;let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}$('png').onclick=()=>{if(!n)return;draw(+$('res').value);cv.toBlob(b=>save(b,'particle-volume.png'));};$('video').onclick=()=>{if(rec){rec.stop();return}if(!n)return;try{let stream=cv.captureStream(30),chunks=[];let type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:16000000}:{});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let m=rec.mimeType;save(new Blob(chunks,{type:m}),'particle-volume.'+(m.includes('mp4')?'mp4':'webm'));stream.getTracks().forEach(t=>t.stop());rec=null;$('video').textContent='Vídeo'};rec.start();$('video').textContent='Parar'}catch(e){status(e.message)}};$('ply').onclick=()=>{if(!n)return;let header=`ply\nformat binary_little_endian 1.0\nelement vertex ${n}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`,buf=new ArrayBuffer(n*15),v=new DataView(buf),mode=$('mode').value,cm=$('color').value,A=hex($('a').value),B=hex($('b').value);for(let i=0;i<n;i++){let j=i*9,k=i*15,z=points[j+2],l=points[j+7];if(mode==='relief')z=(1-l)*cfg.relief+z*.12;else if(mode==='cloud')z*=.3+.7*(1-l);v.setFloat32(k,points[j],true);v.setFloat32(k+4,points[j+1],true);v.setFloat32(k+8,z*cfg.depth,true);for(let c=0;c<3;c++){let q=Math.max(0,Math.min(1,z+.5));v.setUint8(k+12+c,Math.round(255*(cm==='source'?points[j+3+c]:cm==='solid'?A[c]:A[c]*(1-q)+B[c]*q)))}}save(new Blob([header,buf]),'particle-volume.ply')};try{init();requestAnimationFrame(tick)}catch(e){status(e.message);$('empty').innerHTML='<strong>WebGL 2 indisponível</strong><p>Experimenta o Chrome com aceleração gráfica.</p>'}
</script></body></html>
